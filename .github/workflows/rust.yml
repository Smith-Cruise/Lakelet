name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.changes.outputs.src_changed }}
      integration_changed: ${{ steps.changes.outputs.integration_changed }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Check changed files
      id: changes
      run: |
        # Keep the required checks visible for every PR, but only run Rust CI when relevant files change.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
        else
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
        fi

        # Dependency changes (root Cargo.toml/Cargo.lock) must also trigger Rust CI
        # so the new dependency graph is actually validated. web/ is included
        # because the binary embeds the built UI.
        if git diff --name-only "$base" "$head" | grep -Eq '^(src/|web/|Cargo\.(toml|lock)$)'; then
          echo "src_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "src_changed=false" >> "$GITHUB_OUTPUT"
        fi

        if git diff --name-only "$base" "$head" | grep -Eq '^(src/|integration-tests/|Cargo\.(toml|lock)$)'; then
          echo "integration_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "integration_changed=false" >> "$GITHUB_OUTPUT"
        fi

    # The web UI is built once here and embedded into every binary below: the
    # integration binary gets it through web/dist, the unit tests download the
    # same artifact so the embed path is what gets tested.
    - name: Install pnpm
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      uses: pnpm/action-setup@v5
      with:
        package_json_file: web/package.json
    - name: Install Node.js
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Install web dependencies
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      working-directory: web
      run: pnpm install --frozen-lockfile
    - name: Typecheck web UI
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      working-directory: web
      run: pnpm typecheck
    - name: Build web UI
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      working-directory: web
      run: pnpm build
    - name: Upload web UI bundle
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: web-dist
        path: web/dist
        if-no-files-found: error

    - name: Install Rust toolchain
      if: steps.changes.outputs.integration_changed == 'true'
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      if: steps.changes.outputs.integration_changed == 'true'
      uses: Swatinem/rust-cache@v2

    - name: Build Lakelet binary
      if: steps.changes.outputs.integration_changed == 'true'
      run: cargo build -p lakelet-app --bin lakelet

    - name: Upload Lakelet binary
      if: steps.changes.outputs.integration_changed == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: lakelet-debug-bin
        path: target/debug/lakelet
        if-no-files-found: error

  unittest:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v5
      if: needs.build.outputs.src_changed == 'true'
    - name: Install Rust toolchain
      if: needs.build.outputs.src_changed == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Rust Cache
      if: needs.build.outputs.src_changed == 'true'
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      if: needs.build.outputs.src_changed == 'true'
      run: cargo fmt --all -- --check

    - name: Clippy check
      if: needs.build.outputs.src_changed == 'true'
      run: cargo clippy --all-targets --all-features -- -D warnings

    # Deliberately before the bundle is downloaded: this is what proves a
    # checkout with no Node toolchain still builds and tests, and it is the
    # only run that covers the paths taken when `web/dist` holds no bundle.
    - name: Run tests (no web UI bundle)
      if: needs.build.outputs.src_changed == 'true'
      run: cargo test --all-targets --all-features --verbose

    - name: Download web UI bundle
      if: needs.build.outputs.src_changed == 'true'
      uses: actions/download-artifact@v7
      with:
        name: web-dist
        path: web/dist

    - name: Run tests (with web UI bundle)
      if: needs.build.outputs.src_changed == 'true'
      run: cargo test --all-targets --all-features --verbose

  integration-test:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v5
      if: needs.build.outputs.integration_changed == 'true'
    - name: Set up Python
      if: needs.build.outputs.integration_changed == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: integration-tests/requirements.txt
    - name: Integration test jar cache
      if: needs.build.outputs.integration_changed == 'true'
      uses: actions/cache@v5
      with:
        path: integration-tests/.jars
        key: integration-test-jars-${{ runner.os }}-${{ hashFiles('integration-tests/download-jars.sh') }}
    - name: Docker Compose version
      if: needs.build.outputs.integration_changed == 'true'
      run: docker compose version
    - name: Download Lakelet binary
      if: needs.build.outputs.integration_changed == 'true'
      uses: actions/download-artifact@v7
      with:
        name: lakelet-debug-bin
        path: target/debug
    - name: Make Lakelet binary executable
      if: needs.build.outputs.integration_changed == 'true'
      run: chmod +x target/debug/lakelet
    - name: Run integration tests
      if: needs.build.outputs.integration_changed == 'true'
      env:
        LAKELET_BIN: ${{ github.workspace }}/target/debug/lakelet
      run: ./integration-tests/integration-test.sh
