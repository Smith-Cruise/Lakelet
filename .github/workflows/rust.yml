name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Leave room for instrumented binaries and the integration test containers.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.changes.outputs.src_changed }}
      integration_changed: ${{ steps.changes.outputs.integration_changed }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Check changed files
      id: changes
      run: |
        # Keep the required checks visible for every PR, but only run Rust CI when relevant files change.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
        else
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
        fi

        # Dependency changes (root Cargo.toml/Cargo.lock) must also trigger Rust CI
        # so the new dependency graph is actually validated. web/ is included
        # because the binary embeds the built UI.
        shared_paths=(src/ Cargo.toml Cargo.lock .github/workflows/rust.yml codecov.yml)
        if ! git diff --quiet "$base" "$head" -- "${shared_paths[@]}" web/; then
          echo "src_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "src_changed=false" >> "$GITHUB_OUTPUT"
        fi

        if ! git diff --quiet "$base" "$head" -- "${shared_paths[@]}" integration-tests/; then
          echo "integration_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "integration_changed=false" >> "$GITHUB_OUTPUT"
        fi

    # Both test jobs download the same web bundle.
    - name: Install pnpm
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      uses: pnpm/action-setup@v5
      with:
        package_json_file: web/package.json
    - name: Install Node.js
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Install web dependencies
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      working-directory: web
      run: pnpm install --frozen-lockfile
    - name: Typecheck web UI
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      working-directory: web
      run: pnpm typecheck
    - name: Build web UI
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      working-directory: web
      run: pnpm build
    - name: Upload web UI bundle
      if: steps.changes.outputs.src_changed == 'true' || steps.changes.outputs.integration_changed == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: web-dist
        path: web/dist
        if-no-files-found: error

  unittest:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v5
      if: needs.build.outputs.src_changed == 'true'
    - name: Install Rust toolchain
      if: needs.build.outputs.src_changed == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt, llvm-tools-preview
    - name: Install cargo-llvm-cov
      if: needs.build.outputs.src_changed == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov@0.9.2
    - name: Rust Cache
      if: needs.build.outputs.src_changed == 'true'
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      if: needs.build.outputs.src_changed == 'true'
      run: cargo fmt --all -- --check

    - name: Clippy check
      if: needs.build.outputs.src_changed == 'true'
      run: cargo clippy --all-targets --all-features -- -D warnings

    # Deliberately before the bundle is downloaded: this is what proves a
    # checkout with no Node toolchain still builds and tests, and it is the
    # only run that covers the paths taken when `web/dist` holds no bundle.
    - name: Run tests (no web UI bundle)
      if: needs.build.outputs.src_changed == 'true'
      run: |
        cargo llvm-cov clean --workspace
        cargo llvm-cov --workspace --all-targets --all-features --no-report

    - name: Download web UI bundle
      if: needs.build.outputs.src_changed == 'true'
      uses: actions/download-artifact@v7
      with:
        name: web-dist
        path: web/dist

    - name: Run tests (with web UI bundle)
      if: needs.build.outputs.src_changed == 'true'
      run: |
        cargo llvm-cov --workspace --all-targets --all-features --no-report
        cargo llvm-cov report --lcov --output-path unit.lcov

    - name: Upload unit coverage
      if: needs.build.outputs.src_changed == 'true'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: unit.lcov
        flags: unit
        disable_search: true
        fail_ci_if_error: false

  integration-test:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v5
      if: needs.build.outputs.integration_changed == 'true'
    - name: Set up Python
      if: needs.build.outputs.integration_changed == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: integration-tests/requirements.txt
    - name: Integration test jar cache
      if: needs.build.outputs.integration_changed == 'true'
      uses: actions/cache@v5
      with:
        path: integration-tests/.jars
        key: integration-test-jars-${{ runner.os }}-${{ hashFiles('integration-tests/download-jars.sh') }}
    - name: Docker Compose version
      if: needs.build.outputs.integration_changed == 'true'
      run: docker compose version
    - name: Download web UI bundle
      if: needs.build.outputs.integration_changed == 'true'
      uses: actions/download-artifact@v7
      with:
        name: web-dist
        path: web/dist
    - name: Install Rust toolchain
      if: needs.build.outputs.integration_changed == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - name: Install cargo-llvm-cov
      if: needs.build.outputs.integration_changed == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov@0.9.2
    - name: Rust Cache
      if: needs.build.outputs.integration_changed == 'true'
      uses: Swatinem/rust-cache@v2
    - name: Run integration tests
      if: needs.build.outputs.integration_changed == 'true'
      run: |
        cargo llvm-cov show-env --sh > "$RUNNER_TEMP/lakelet-coverage-env.sh"
        source "$RUNNER_TEMP/lakelet-coverage-env.sh"
        cargo llvm-cov clean --workspace
        cargo build -p lakelet-app --bin lakelet
        LAKELET_BIN="${CARGO_LLVM_COV_TARGET_DIR}/debug/lakelet" ./integration-tests/integration-test.sh
        cargo llvm-cov report --lcov --output-path integration.lcov
    - name: Upload integration coverage
      if: needs.build.outputs.integration_changed == 'true'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: integration.lcov
        flags: integration
        disable_search: true
        fail_ci_if_error: false
