name: Nightly

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch: {}
  # TODO: temporary trigger to verify this workflow before merging; remove.
  push:
    branches: [publish-binary]

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  RELEASE_TAG: nightly

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.compare.outputs.should_run }}
      sha: ${{ steps.compare.outputs.sha }}
      short_sha: ${{ steps.compare.outputs.short_sha }}
      date: ${{ steps.compare.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare HEAD with last nightly
        id: compare
        run: |
          head_sha=$(git rev-parse HEAD)
          # A lightweight tag resolves via the plain ref; an annotated tag via the ^{} line.
          tag_sha=$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" "refs/tags/${RELEASE_TAG}" | head -n1 | cut -f1)
          if [ "$head_sha" = "$tag_sha" ]; then
            echo "No new commits since last nightly ($tag_sha); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found (last nightly: ${tag_sha:-none}, HEAD: $head_sha)."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${head_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            rustflags: -C target-cpu=x86-64-v3
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            rustflags: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            rustflags: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            rustflags: -C target-cpu=x86-64-v3
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: -C target-cpu=x86-64-v3
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install NASM (aws-lc-sys)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Build release binary
        run: cargo build --release -p lakelet-app --bin lakelet --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          pkg="lakelet-nightly-${{ matrix.target }}"
          mkdir -p "dist/$pkg"
          cp "target/${{ matrix.target }}/release/lakelet" "dist/$pkg/"
          cp README.md LICENSE config_demo.toml "dist/$pkg/"
          tar -czf "dist/$pkg.tar.gz" -C dist "$pkg"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "lakelet-nightly-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$pkg" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lakelet.exe" "dist/$pkg/"
          Copy-Item README.md, LICENSE, config_demo.toml "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lakelet-nightly-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish nightly release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
          DATE: ${{ needs.check.outputs.date }}
        run: |
          gh release delete "$RELEASE_TAG" --yes || true
          git push origin ":refs/tags/$RELEASE_TAG" || true
          cat > notes.md <<EOF
          Automated nightly build of commit ${SHA}.

          This release is replaced every day when new commits land on \`main\`.

          | Asset | Platform | Notes |
          |---|---|---|
          | \`lakelet-nightly-x86_64-unknown-linux-gnu.tar.gz\` | Linux x86_64 | glibc 2.35+, requires x86-64-v3 (AVX2, Intel Haswell 2013+ / AMD Excavator+) |
          | \`lakelet-nightly-aarch64-unknown-linux-gnu.tar.gz\` | Linux ARM64 | glibc 2.35+ |
          | \`lakelet-nightly-aarch64-apple-darwin.tar.gz\` | macOS Apple Silicon | |
          | \`lakelet-nightly-x86_64-apple-darwin.tar.gz\` | macOS Intel | requires x86-64-v3 (AVX2) |
          | \`lakelet-nightly-x86_64-pc-windows-msvc.zip\` | Windows x86_64 | requires x86-64-v3 (AVX2) |
          EOF
          gh release create "$RELEASE_TAG" \
            --target "$SHA" \
            --prerelease \
            --title "Nightly $DATE ($SHORT_SHA)" \
            --notes-file notes.md \
            dist/*
