[project]
site_name = "Lakelet"
site_url = "https://lakelet.dev/"
site_description = "A DataFusion-based query engine for lakehouse workloads"
repo_url = "https://github.com/Smith-Cruise/Lakelet"
repo_name = "Smith-Cruise/Lakelet"
docs_dir = "src"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]
nav = [
  { "Home" = "index.md" },
  { "Docs" = [
    { "Getting started" = "getting-started.md" },
    { "Server" = "server.md" },
    { "Storage" = "storage.md" },
    { "Catalogs" = [
      { "Overview" = "catalogs/index.md" },
      { "HMS" = "catalogs/hms.md" },
      { "Glue" = "catalogs/glue.md" },
      { "Paimon FileSystem" = "catalogs/paimon-filesystem.md" },
      { "Iceberg REST" = "catalogs/iceberg-rest.md" },
      { "TPC-H" = "catalogs/tpch.md" },
      { "TPC-DS" = "catalogs/tpcds.md" },
    ] },
    { "Table Formats" = [
      { "Hive" = "table-formats/hive.md" },
      { "Iceberg" = "table-formats/iceberg.md" },
      { "Delta Lake" = "table-formats/delta-lake.md" },
      { "Paimon" = "table-formats/paimon.md" },
    ] },
    { "SQL" = [
      { "CALL PROCEDURE" = "sql/call-procedure.md" },
      { "CREATE SCHEMA" = "sql/create-schema.md" },
      { "CREATE TABLE" = "sql/create-table.md" },
      { "DESCRIBE" = "sql/describe.md" },
      { "DROP SCHEMA" = "sql/drop-schema.md" },
      { "DROP TABLE" = "sql/drop-table.md" },
      { "INSERT" = "sql/insert.md" },
      { "SHOW CATALOGS" = "sql/show-catalogs.md" },
      { "SHOW CREATE TABLE" = "sql/show-create-table.md" },
      { "SHOW SCHEMAS" = "sql/show-schemas.md" },
      { "SHOW TABLES" = "sql/show-tables.md" },
      { "SHOW VARIABLES" = "sql/show-variables.md" },
      { "USE" = "sql/use.md" },
    ] },
  ] },
]

[project.extra]
generator = false

[project.theme]
language = "en"
# Fonts are self-hosted in assets/fonts for reliable loading.
font = false
logo = "assets/lakelet-mark.svg"
favicon = "assets/favicon.png"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.footer",
  "content.action.copy",
  "content.code.copy",
]

[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
Guides = ["index.md", "getting-started.md", "server.md", "storage.md"]
Catalogs = ["catalogs/*.md"]
"Table Formats" = ["table-formats/*.md"]
SQL = ["sql/*.md"]

# Lakeside has one light theme; extra.css supplies the shared design tokens.

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.superfences]

# Icons are inlined as SVG; the `zensical` namespace extends `pymdownx` here.
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
