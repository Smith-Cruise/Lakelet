[project]
site_name = "Lakelet"
site_url = "https://lakelet.dev/"
site_description = "A DataFusion-based query engine for lakehouse workloads"
repo_url = "https://github.com/Smith-Cruise/Lakelet"
repo_name = "Smith-Cruise/Lakelet"
docs_dir = "src"
nav = [
  { "Home" = "index.md" },
  { "Docs" = [
    { "Getting started" = "getting-started.md" },
    { "Server" = "server.md" },
    { "Catalog" = "catalog.md" },
    { "Storage" = "storage.md" },
    { "Table formats" = [
      { "Overview" = "table-format/index.md" },
      { "Hive" = "table-format/hive.md" },
      { "Iceberg" = "table-format/iceberg.md" },
      { "Delta Lake" = "table-format/delta-lake.md" },
      { "Paimon" = "table-format/paimon.md" },
    ] },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.footer",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.superfences]

# Icons are inlined as SVG; the `zensical` namespace extends `pymdownx` here.
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
