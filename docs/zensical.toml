[project]
site_name = "Lakelet"
site_url = "https://lakelet.dev/"
site_description = "A DataFusion-based query engine for lakehouse workloads"
repo_url = "https://github.com/Smith-Cruise/Lakelet"
repo_name = "Smith-Cruise/Lakelet"
docs_dir = "src"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]
nav = [
  { "Home" = "index.md" },
  { "Docs" = [
    { "Getting started" = "getting-started.md" },
    { "Server" = "server.md" },
    { "Storage" = "storage.md" },
    { "Catalogs" = [
      { "Overview" = "catalogs/index.md" },
      { "HMS" = "catalogs/hms.md" },
      { "Glue" = "catalogs/glue.md" },
      { "Paimon FileSystem" = "catalogs/paimon-filesystem.md" },
      { "Iceberg REST" = "catalogs/iceberg-rest.md" },
    ] },
    { "Table Formats" = [
      { "Hive" = "table-formats/hive.md" },
      { "Iceberg" = "table-formats/iceberg.md" },
      { "Delta Lake" = "table-formats/delta-lake.md" },
      { "Paimon" = "table-formats/paimon.md" },
    ] },
  ] },
]

[project.theme]
language = "en"
logo = "assets/lakelet-mark.svg"
favicon = "assets/favicon.png"
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.footer",
  "content.code.copy",
]

# Lakebed is a single theme, so there is no palette table: without one the
# theme emits no `data-md-color-scheme`, renders no light/dark toggle, and
# falls back to its own `:root` defaults, which `stylesheets/extra.css`
# overrides wholesale.

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.superfences]

# Icons are inlined as SVG; the `zensical` namespace extends `pymdownx` here.
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
