site_name: Lakelet
docs_dir: src
site_url: https://lakelet.dev/
site_description: A DataFusion-based query engine for lakehouse workloads
repo_url: https://github.com/Smith-Cruise/Lakelet
repo_name: Smith-Cruise/Lakelet

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Docs:
      - Getting started: getting-started.md
      - Server: server.md
      - Catalog: catalog.md
      - Storage: storage.md
      - Table formats:
          - Overview: table-format/index.md
          - Hive: table-format/hive.md
          - Iceberg: table-format/iceberg.md
          - Delta Lake: table-format/delta-lake.md
          - Paimon: table-format/paimon.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
