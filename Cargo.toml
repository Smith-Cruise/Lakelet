[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "src/app",
    "src/common",
    "src/storage"
]

[workspace.dependencies]
datafusion = "53.1.0"
datafusion-cli = "53.1.0"
sqlparser = "0.61.0"
arrow-flight = { version = "58.1.0", features = ["flight-sql"] }
tonic = "0.14"
prost = "0.14"
tokio = { version = "1.0", features = ["rt-multi-thread", "tracing", "rt", "signal"] }
console-subscriber = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
typetag = "0.2"
toml = "0.9.5"
futures = "0.3.31"
async-trait = "0.1.88"
bytes = "1"
url = "2.5.7"
percent-encoding = "2.3"
iceberg = "0.10.0"
iceberg-datafusion = "0.10.0"
opendal = { version = "0.57", features = ["services-s3", "services-oss", "services-hdfs-native"] }
object_store_opendal = "0.57"
deltalake = { version = "0.32.2", features = ["datafusion"] }
paimon = { version = "0.2.0", features = ["storage-s3", "storage-oss", "storage-hdfs"] }
paimon-datafusion = "0.2.0"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
async-stream = "0.3"
mimalloc = { version = "0.1", default-features = false }
lakelet-app = { path = "src/app" }
lakelet-storage = {path = "src/storage"}
lakelet-common = {path = "src/common"}

[profile.release]
lto = true
codegen-units = 1
