[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "src/app",
    "src/common",
    "src/storage"
]

[workspace.dependencies]
datafusion = { version = "55.2.0", features = ["avro"] }
datafusion-cli = "55.2.0"
tpchgen = "4.0.0"
tpchgen-arrow = { version = "4.0.0", default-features = false, features = ["arrow_59"] }
tpcdsgen = "4.0.0"
tpcdsgen-arrow = { version = "4.0.0", default-features = false, features = ["arrow_59"] }
orc-rust = { version = "0.9.0", features = ["async"] }
sqlparser = "0.62.0"
arrow-flight = { version = "59.2.0", features = ["flight-sql"] }
prost = "0.14"
tonic = "0.14.6"
tonic-web = "0.14.6"
# default-features = false matches how tonic already depends on axum, so the
# web UI adds no transitive dependencies of its own.
axum = { version = "0.8", default-features = false }
# embed web resources in lakelet binary
rust-embed = { version = "8.12", features = ["mime-guess"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "tracing", "rt", "signal", "sync"] }
console-subscriber = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
typetag = "0.2"
toml = "0.9.5"
futures = "0.3.31"
async-trait = "0.1.92"
bytes = "1"
url = "2.5.7"
percent-encoding = "2.3"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg", rev = "b641e5ebe9e92967499ae7e440ba10d7797712df" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
opendal = { version = "0.58.1", features = ["services-s3", "services-oss", "services-hdfs-native"] }
object_store_opendal = "0.58.0"
deltalake = { version = "1.1.2", features = ["datafusion"] }
paimon = { git = "https://github.com/Smith-Cruise/paimon-rust", branch = "bump-datafusion", features = ["storage-s3", "storage-oss", "storage-hdfs"] }
paimon-datafusion = { git = "https://github.com/Smith-Cruise/paimon-rust", branch = "bump-datafusion" }
mimalloc = { version = "0.1", default-features = false }
moka = { version = "0.12.16", features = ["sync"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
lakelet-app = { path = "src/app" }
lakelet-storage = {path = "src/storage"}
lakelet-common = {path = "src/common"}

[profile.release]
debug = 0
lto = "thin"
opt-level = "s"
codegen-units = 1
